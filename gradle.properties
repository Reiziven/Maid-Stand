org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- Minecraft / NeoForge -------------------------------------------------
minecraft_version=1.21.1
# Range used in neoforge.mods.toml (inclusive lower, exclusive upper)
minecraft_version_range=[1.21.1,1.22)
# NeoForge 21.1.x == Minecraft 1.21.1
neo_version=21.1.259
# Range used in neoforge.mods.toml
neo_version_range=[21.1.0,)
# FML (javafml) loader version range
loader_version_range=[1,)

# Official (Mojang) mappings are used by NeoForge; parchment is optional.
# Leave parchment_mappings_version empty to disable.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---- Mod properties ---------------------------------------------------------
mod_id=cirno
mod_name=Cirno
mod_license=MIT
mod_version=1.0.7
mod_group_id=net.zhaiji
mod_authors=zhaiji
mod_description=

# ---- Dependencies -----------------------------------------------------------
# Curios (optional dependency)
curios_version=9.5.1+1.21.1
curios_version_range=[9.0.0,)
# GeckoLib (required) - 1.21.1 NeoForge artifact
geckolib_version=4.9.3
geckolib_version_range=[4.8,)
# Touhou Little Maid (optional compat) 1.5.3-neoforge+mc1.21.1
# CurseForge project id 355044, file id 8061852
tlm_curse_project=touhou-little-maid-355044
tlm_curse_file=8061852
tlm_version_range=[1.5.0,)
